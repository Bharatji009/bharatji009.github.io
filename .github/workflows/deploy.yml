name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A54495: ${{ secrets.A54495 }}
          BECDC7: ${{ secrets.BECDC7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A54495', '')
          bm = os.environ.get('BECDC7', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 23f6faea99b046f6d19152836b2f -->', gm)
          if bm:
              s2 = s2.replace('<!-- 7ed3d24b8d8164cb6cb624c320ae70 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
